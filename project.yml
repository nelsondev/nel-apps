name: NelApps
options:
  bundleIdPrefix: lab.nel
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.9'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGNING_ALLOWED: 'NO'
    SWIFT_OPTIMIZATION_LEVEL: '-Onone'
    SWIFT_COMPILATION_MODE: singlefile
targets:
  NelApps:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lab.nel.nelapps
        INFOPLIST_KEY_CFBundleDisplayName: NelApps
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: 'YES'
        INFOPLIST_KEY_NSSupportsLiveActivities: 'YES'
        GENERATE_INFOPLIST_FILE: 'YES'
    dependencies:
      - target: NelWidgets
        embed: true
  NelWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lab.nel.nelapps.widgets
        INFOPLIST_FILE: Widget/Info.plist
        GENERATE_INFOPLIST_FILE: 'NO'
        SKIP_INSTALL: 'YES'
